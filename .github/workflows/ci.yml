name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    env:
      NODE_ENV: test
      DATABASE_URL: "mysql://test:test@localhost:3306/testdb"
      DATABASE_WRITER_URL: "mysql://test:test@localhost:3306/testdb"
      DATABASE_READER_URL: "mysql://test:test@localhost:3306/testdb"
      REDIS_URL: ""
      OPENSEARCH_URL: ""
      S3_BUCKET_UPLOADS: "test-bucket"
      CLOUDFRONT_DOMAIN: "https://test.cloudfront.net"
      JWT_SECRET: "ci-test-secret"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Type check server
        run: npx tsc --noEmit
        working-directory: server

      - name: Run server tests
        run: npx vitest --run
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Build client
        run: npm run build
        working-directory: client
